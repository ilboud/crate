# Two containers on the NAS: the app, and the Discogs MCP server it asks about
# pressings and marketplace data.
#
# Both stay on the LAN. There is no authentication layer, which is the
# deliberate trade recorded in the design: the Discogs token can modify the
# collection, so the app is not exposed to the internet. Reach it from outside
# the house over Tailscale or the Synology VPN rather than by opening a port.

# Pin the project name. Compose otherwise derives it from the directory, which
# prefixes every volume — the same file would produce crate_crate-data on the
# NAS and discogs_crate-data here, and a backup command naming one would
# silently create an empty volume rather than find the other.
name: crate

services:
  discogs-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: crate:latest
    container_name: discogs-app
    restart: unless-stopped
    ports:
      # Host port defaults to 8088. Change the left side if the NAS already
      # uses it — DSM itself listens on 5000/5001.
      - "${APP_PORT:-8088}:8080"
    volumes:
      # Named volumes, not bind mounts. Docker initialises an empty named
      # volume from the image's own directory — ownership included — and the
      # Dockerfile already chowns /data and /covers to the node user. A bind
      # mount instead takes the host directory's ownership, so on a NAS it
      # arrives root-owned and the app cannot write its database. Synology's
      # daemon also refuses to create a missing bind path at all.
      #
      # To keep the files somewhere you can browse instead, swap these for
      # `./data:/data` and `./covers:/covers`, then create the directories and
      # `chown -R 1000:1000` them before the first start.
      - crate-data:/data
      - crate-covers:/covers
    environment:
      DB_PATH: /data/collection.db
      COVERS_DIR: /covers
      WEB_DIR: /app/web/dist
      PORT: "8080"
      HOST: 0.0.0.0
      # Sync needs this, on the CLI and for the app's own Sync now button
      # and schedule. Read-only: the collection is only ever edited on Discogs.
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN:?set this in .env}
      DISCOGS_USERNAME: ${DISCOGS_USERNAME:-}
      # Chat. Set whichever you use; CHAT_BACKEND picks between them.
      #
      # No defaults here on purpose. Anything set in the environment overrides
      # the Settings screen and greys the control out, so giving these a
      # fallback value would hard-code a choice into every deployment and take
      # the switch away from the person using it. Empty means "not set", and
      # the app falls back to its own defaults and its own UI.
      CHAT_BACKEND: ${CHAT_BACKEND:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Required when the Anthropic key covers all workspaces; the API rejects
      # such a key without it.
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      MCP_URL: http://discogs-mcp:3001/mcp
    depends_on:
      - discogs-mcp

  discogs-mcp:
    image: node:20-bookworm-slim
    container_name: discogs-mcp
    restart: unless-stopped
    # HTTP stream mode rather than stdio, so the app reaches it as a peer over
    # the Docker network instead of managing a subprocess.
    command: npx -y discogs-mcp-server stream
    environment:
      DISCOGS_PERSONAL_ACCESS_TOKEN: ${DISCOGS_PERSONAL_ACCESS_TOKEN:?set this in .env}
      PORT: "3001"
      SERVER_HOST: 0.0.0.0
    expose:
      - "3001"

volumes:
  # Both hold derived state: everything here is rebuildable from Discogs by
  # running the sync and art commands. What is not rebuildable is small and
  # accumulates over time — genre overrides, "I own both" dismissals and the
  # stored API keys — so crate-data is the one worth backing up.
  crate-data:
  crate-covers:
