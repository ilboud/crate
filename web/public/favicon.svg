<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Records">
  <!--
    A record. It has to survive being drawn at 16px in a browser tab, on a
    light or a dark background, so it is built from three things that stay
    legible when everything else disappears: a dark disc, a pale rim that
    keeps it from vanishing into a dark tab, and a red label at the centre.
    The grooves are texture for the large sizes and are allowed to blur away.
  -->
  <circle cx="32" cy="32" r="31" fill="#1f1916" stroke="#e8e1d4" stroke-width="2"/>
  <g fill="none" stroke="#e8e1d4" stroke-opacity="0.22">
    <circle cx="32" cy="32" r="26" stroke-width="1.1"/>
    <circle cx="32" cy="32" r="22.5" stroke-width="1.1"/>
    <circle cx="32" cy="32" r="19" stroke-width="1.1"/>
  </g>
  <circle cx="32" cy="32" r="12" fill="#c8462e"/>
  <circle cx="32" cy="32" r="2.6" fill="#14100e"/>
</svg>
